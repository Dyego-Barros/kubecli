[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubecli-tools"
version = "0.1.0"
description = "CLI unificada para kubectl, kubens, kubectx e oc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kubecli = "kubecli:main"
kubecli-desktop = "kubecli_desktop:main"

[tool.setuptools]
py-modules = ["kubecli", "kubecli_desktop", "settings", "runtime", "aliases", "cloud", "installation", "kubeconfig", "prompt"]
