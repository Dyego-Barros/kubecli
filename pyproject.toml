[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubecli-tools"
version = "0.1.0"
description = "CLI unificada para kubectl, kubens, kubectx e oc"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "fastmcp>=3.4.7",
]

[project.scripts]
kubecli = "cli.kubecli:main"
ai = "cli.ai_entry:main"

[tool.setuptools.packages.find]
include = ["cli*"]
